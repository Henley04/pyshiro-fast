[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyshiro-fast"
dynamic = ["version"]
description = "Fast HSMM forced alignment for Japanese singing voice: a drop-in pyshiro fork with O(N·T) decoding and 100-700x speedups on long audio"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "pyshiro-fast contributors" },
]
maintainers = [
    { name = "henley04" },
]
keywords = [
    "forced-alignment",
    "hsmm",
    "hmm",
    "viterbi",
    "singing-voice",
    "lyrics",
    "phoneme",
    "japanese",
    "music-information-retrieval",
    "nnsvs",
    "enunu",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "soundfile>=0.12",
    "numba>=0.57",
    "msgpack>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=5",
    "build>=1.2",
    "twine>=5",
    "markdown>=3",
]

[project.urls]
Homepage   = "https://henley04.github.io/pyshiro-fast/"
Documentation = "https://henley04.github.io/pyshiro-fast/quickstart.html"
Repository = "https://github.com/henley04/pyshiro-fast"
Issues     = "https://github.com/henley04/pyshiro-fast/issues"
Changelog  = "https://github.com/henley04/pyshiro-fast/blob/main/CHANGELOG.md"
Upstream   = "https://github.com/wavtechyukky/pyshiro"

[project.scripts]
pyshiro-align = "pyshiro.align:main"
pyshiro-train = "pyshiro.train:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "pyshiro.__version__" }

[tool.setuptools.packages.find]
include = ["pyshiro*", "pyshiro_fast*"]
exclude = ["tests*", "bench*", "workflow*", "example*"]

[tool.setuptools.package-data]
pyshiro = [
    "data/*.table",
    "data/models/*.hsmm",
    "data/models/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
