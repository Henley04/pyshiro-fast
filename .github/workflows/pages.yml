name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build and deploy docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        run: pip install "markdown>=3"

      - name: Build the static site
        run: python scripts/build_docs.py

      - name: Fail if the committed HTML is stale
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            echo "docs/*.html does not match docs/*.md - run scripts/build_docs.py and commit."
            git status --porcelain docs
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true          # turns Pages on if it is not enabled yet

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
