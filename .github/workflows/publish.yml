name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install "build>=1.2" "twine>=5"

      - name: Verify tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, re, sys
          version = re.search(r'__version__\s*=\s*"([^"]+)"',
                              open("pyshiro/__init__.py", encoding="utf-8").read()).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match __version__ {version}")
          print(f"tag {tag} matches __version__ {version}")
          PY

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    name: upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyshiro-fast
    permissions:
      id-token: write        # trusted publishing, no API token needed
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
