name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: End-to-end smoke test
        run: python examples/synthetic_demo.py

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install "build>=1.2" "twine>=5"

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Check the wheel contains the models
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          need = [
              "pyshiro/data/models/pyshiro-jp-v2.hsmm",
              "pyshiro/data/models/pyshiro-jp-v2_phonemap.json",
              "pyshiro/data/kana2phonemes.table",
              "pyshiro_fast/__init__.py",
          ]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit(f"wheel is missing: {missing}")
          print(f"{wheel}: {len(names)} files, package data present")
          PY

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/python -c "import pyshiro; print(pyshiro.__version__, pyshiro.load_bundled_model()[0].nstate)"

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  docs:
    name: docs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install "markdown>=3"
      - name: Rebuild and compare
        run: |
          python scripts/build_docs.py
          git diff --exit-code docs/ || {
            echo "docs/*.html is out of date. Run: python scripts/build_docs.py"
            exit 1
          }
